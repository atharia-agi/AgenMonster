[package]
name = "monster-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "agenmonster"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive", "env"] }
futures.workspace = true
dirs.workspace = true
dotenvy.workspace = true
chrono.workspace = true

monster-bus      = { path = "../monster-bus" }
monster-audio    = { path = "../monster-audio" }
monster-runtime  = { path = "../monster-runtime" }
monster-llm      = { path = "../monster-llm" }
monster-tools    = { path = "../monster-tools" }
monster-agent    = { path = "../monster-agent" }
monster-skills   = { path = "../monster-skills" }
monster-memory  = { path = "../monster-memory" }
