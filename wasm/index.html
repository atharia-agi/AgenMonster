<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgenMonster WASM</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }
    body {
      font-family: 'Press Start 2P', monospace;
      background: #0d0d1a;
      color: #f5f0e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { font-size: 16px; margin-bottom: 20px; }
    .pet-container {
      width: 240px;
      height: 240px;
      border: 2px solid #333;
      position: relative;
      overflow: hidden;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 100%;
      height: 100%;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 8px;
    }
    button {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      background: #333;
      color: #f5f0e6;
      border: 1px solid #555;
      padding: 8px 16px;
      cursor: pointer;
    }
    button:hover { background: #444; }
    .status {
      margin-top: 16px;
      font-size: 10px;
      color: #888;
    }
    #output {
      margin-top: 12px;
      font-size: 9px;
      color: #90c878;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <h1>AGENMONSTER WASM</h1>
  <div class="pet-container">
    <canvas id="pet-canvas" width="240" height="240"></canvas>
  </div>
  <div class="controls">
    <button id="btn-hello">SAY HELLO</button>
    <button id="btn-evolve">EVOLVE</button>
    <button id="btn-status">STATUS</button>
  </div>
  <div class="status" id="status">Stage: EGG | Energy: 1000/1000</div>
  <div id="output"></div>

  <script type="module">
    // Placeholder — WASM module would be loaded here
    const canvas = document.getElementById('pet-canvas');
    const ctx = canvas.getContext('2d');

    // Simple pixel pet renderer (no WASM needed for demo)
    let stage = 'egg';
    const palettes = {
      egg: ['#f5f0e6','#dcd2c3','#f0e8d8','#c8bfa8'],
      hatchling: ['#90c878','#70a858','#b0d898','#508838'],
      baby: ['#88ccf0','#60a8d8','#a0d8f8','#4888c0'],
    };

    function drawPet() {
      ctx.fillStyle = '#0d0d1a';
      ctx.fillRect(0, 0, 240, 240);
      const pal = palettes[stage] || palettes.egg;
      const cx = 120, cy = 120;
      // Body
      ctx.fillStyle = pal[1];
      ctx.fillRect(cx-20, cy-16, 40, 36);
      // Belly
      ctx.fillStyle = pal[2];
      ctx.fillRect(cx-12, cy-4, 24, 20);
      // Head
      ctx.fillStyle = pal[1];
      ctx.fillRect(cx-16, cy-36, 32, 24);
      // Eyes
      ctx.fillStyle = '#fff';
      ctx.fillRect(cx-12, cy-30, 10, 10);
      ctx.fillRect(cx+2, cy-30, 10, 10);
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(cx-8, cy-28, 6, 8);
      ctx.fillRect(cx+4, cy-28, 6, 8);
      // Arms
      ctx.fillRect(cx-26, cy-8, 6, 16);
      ctx.fillRect(cx+20, cy-8, 6, 16);
      // Legs
      ctx.fillRect(cx-14, cy+20, 8, 12);
      ctx.fillRect(cx+6, cy+20, 8, 12);
    }

    drawPet();

    document.getElementById('btn-hello').onclick = () => {
      document.getElementById('output').textContent = 'bark! hello from WASM!';
    };
    document.getElementById('btn-evolve').onclick = () => {
      const stages = ['egg','hatchling','baby'];
      const idx = stages.indexOf(stage);
      stage = stages[(idx + 1) % stages.length];
      drawPet();
      document.getElementById('status').textContent = `Stage: ${stage.toUpperCase()} | Energy: 1000/1000`;
      document.getElementById('output').textContent = `Evolved to ${stage}!`;
    };
    document.getElementById('btn-status').onclick = () => {
      document.getElementById('output').textContent = JSON.stringify({stage, energy: 1000, skills: 0});
    };
  </script>
</body>
</html>
