version: "3.9"
services:
  qdrant:
    image: qdrant/qdrant:v1.13.0
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant-data:/qdrant/storage
  ollama:
    image: ollama/ollama:0.5.5
    ports: ["11434:11434"]
    volumes:
      - ollama-data:/root/.ollama
volumes:
  qdrant-data:
  ollama-data:
