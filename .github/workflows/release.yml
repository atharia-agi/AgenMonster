name: Release Draft on Tag Push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Set cross-compilation linker
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-g++" >> "$GITHUB_ENV"

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Install app dependencies
        run: cd apps/desktop && CI=1 npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Build web frontend
        run: cd apps/desktop && CI=1 npm run build

      - name: Build Windows desktop EXE
        run: cd apps/desktop && npx tauri build --target x86_64-pc-windows-gnu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect build artifacts
        run: |
          mkdir -p release-artifacts
          BUILD_DIR="apps/desktop/src-tauri/target/x86_64-pc-windows-gnu/release"
          find "$BUILD_DIR" -maxdepth 1 -name "*.exe" -exec cp {} release-artifacts/ \;
          find "$BUILD_DIR" -maxdepth 1 -name "*.dll" -exec cp {} release-artifacts/ \;
          find "$BUILD_DIR/bundle/nsis" -maxdepth 1 -name "*.exe" -exec cp {} release-artifacts/ \;

      - name: ZIP portable bundle
        run: |
          mkdir -p release-artifacts/AgenMonster
          cp release-artifacts/agenmonster-desktop.exe release-artifacts/AgenMonster/ 2>/dev/null || true
          cp release-artifacts/agenmonster_desktop_lib.dll release-artifacts/AgenMonster/ 2>/dev/null || true
          cp release-artifacts/WebView2Loader.dll release-artifacts/AgenMonster/ 2>/dev/null || true
          cp apps/desktop/build/_app/immutable/assets/*.css release-artifacts/AgenMonster/ 2>/dev/null || true
          cp apps/desktop/build/_app/immutable/chunks/*.js release-artifacts/AgenMonster/ 2>/dev/null || true
          cp apps/desktop/build/_app/entry/*.js release-artifacts/AgenMonster/ 2>/dev/null || true
          cp apps/desktop/build/_app/nodes/*.js release-artifacts/AgenMonster/ 2>/dev/null || true
          cp apps/desktop/build/*.js release-artifacts/AgenMonster/ 2>/dev/null || true
          cp apps/desktop/build/*.html release-artifacts/AgenMonster/ 2>/dev/null || true
          cp apps/desktop/build/*.png release-artifacts/AgenMonster/ 2>/dev/null || true
          cp apps/desktop/build/*.ico release-artifacts/AgenMonster/ 2>/dev/null || true
          cp apps/desktop/build/*.json release-artifacts/AgenMonster/ 2>/dev/null || true
          cp apps/desktop/build/*.wasm release-artifacts/AgenMonster/ 2>/dev/null || true
          cp apps/desktop/build/LICENSE release-artifacts/AgenMonster/ 2>/dev/null || true
          cd release-artifacts && zip -r ../AgenMonster-portable-win64.zip AgenMonster

      - name: Compute checksums
        id: checksums
        run: |
          cd release-artifacts
          for f in *; do
            echo "$(sha256sum "$f" | awk '{print $1}')  $f" >> ../checksums.txt
          done
          echo "checksums_file=checksums.txt" >> "$GITHUB_OUTPUT"

      - name: Build changelog from last tag
        id: changelog
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            git log "$PREV_TAG..HEAD" --no-merges --pretty=format:"- %s (%h)" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "- Initial release of AgenMonster Desktop v${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/*.exe
            release-artifacts/*.dll
            release-artifacts/AgenMonster-portable-win64.zip
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.txt
          retention-days: 30
