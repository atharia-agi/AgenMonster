name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: node --test --experimental-strip-types tests/*.test.ts

  typecheck:
    name: Type Check (svelte-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx svelte-check --tsconfig ./tsconfig.json

  build:
    name: Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/desktop
    needs: [test, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle Analysis
        run: npm run bundle:report

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: apps/desktop/build/
          retention-days: 7

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/desktop
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start Preview Server
        run: |
          npm run preview &
          sleep 10

      - name: Run E2E Tests
        env:
          E2E_URL: http://localhost:4173
        run: npx playwright test --reporter=github

      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/desktop/test-results/
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check for TODO/FIXME in production code
        run: |
          if grep -r "TODO\|FIXME" --include="*.ts" --include="*.svelte" src/ | grep -v test | grep -v ".d.ts"; then
            echo "::warning::TODO/FIXME comments found in production code"
          fi

      - name: Check for console.log in production code
        run: |
          if grep -r "console\.log" --include="*.ts" --include="*.svelte" src/ | grep -v test | grep -v ".d.ts"; then
            echo "::warning::console.log found in production code"
          fi
